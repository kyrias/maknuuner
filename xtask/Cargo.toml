[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = { version = "1.0.104", default-features = false }
reqwest = { version = "0.13.4", features = ["blocking", "default-tls"], default-features = false }
topcoat-asset = { version = "0.5.0", features = ["bundler"], default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
