[package]
name = "maknuuner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
caseless = "0.2.2"
compact_str = { version = "0.10.0", features = ["serde"] }
csv = "1.4.0"
interner = "0.2.1"
itertools = "0.15.0"
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
topcoat = "0.5.0"
unicode-normalization = "0.1.25"
